tain{border-color:#b58825;background:var(--amberbg)}.explain{padding:16px 18px;border-radius:13px;background:var(--bluebg);border:1px solid #d6e2fc;margin:17px 0}.explain.good{background:var(--greenbg);border-color:#b8e3ce}.explain.bad{background:var(--redbg);border-color:#f1c9cf}.explain.warning{background:var(--amberbg);border-color:#f2d78c}.explain p{margin:7px 0}.btn{border:0;background:var(--blue);color:#fff;border-radius:12px;padding:13px 18px;min-height:50px;font-size:16px;font-weight:750;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;max-width:100%}.btn:hover{filter:brightness(.95)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{background:white;color:var(--blue);border:2px solid #b9cbe9}.btn.ghost{background:#e8eefb;color:var(--blue)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.actions .btn{flex:1 1 155px}.btn.full{width:100%}.notice{color:#6b511a;background:var(--amberbg);padding:13px 15px;border:1px solid #eed78d;border-radius:12px;line-height:1.5}.review-item{border-bottom:1px solid var(--border);padding:15px 0;overflow-wrap:anywhere}.review-item:last-child{border-bottom:0}.review-item p{margin:6px 0}.answer{color:var(--green);font-weight:700}.picked{color:var(--red);font-weight:700}.small{font-size:14px;color:var(--muted)}.hidden{display:none!important}.footer-note{font-size:14px;color:var(--muted);margin-top:16px}.touchbar{position:sticky;bottom:8px;padding:8px 0;background:linear-gradient(to bottom,transparent,var(--bg) 17%)}.touchbar .btn{width:100%;min-height:54px}#app{overflow-wrap:break-word}@media(max-width:390px){.panel{padding:16px}.opt{padding:12px 11px;gap:9px}.opt .letter{flex-basis:25px}.actions .btn{flex-basis:100%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

<script>
'use strict';
const BANK=[{"id":1,"q":"Which of the following best describes Indigenous people based on the definition presented in the lecture module?","options":["Groups of people who have recently migrated to a region and adopted its culture","People who share a common religion but come from different geographic areas","Culturally distinct ethnic groups descended from the earliest inhabitants of a region who maintain elements of their original culture and language","Individuals who live in urban areas and follow modern global traditions","Communities that have no historical connection to a specific geographic region"],"correct":2,"why":["Recent migration does not establish Indigenous ancestry.","Religion alone does not define Indigenous peoples.","Indigenous identity involves ancestry and continuing cultural links to original inhabitants.","Urban residence does not determine Indigenous identity.","This contradicts the ancestral connection in the definition."],"flag":""},{"id":2,"q":"Which statement best reflects the purpose of Indigenous Psychology as described in the lecture module?","options":["It focuses on applying universal psychological theories without considering cultural differences","It emphasises using research methods and therapies that are culturally appropriate for specific populations","It prioritises scientific methods developed exclusively in Western countries","It studies only the historical behaviours of Indigenous populations without addressing mental health","It replaces all traditional healing practices with modern clinical approaches"],"correct":1,"why":["Universal application without cultural context is not the approach.","Culturally suitable methods and treatments are central.","Western methods are not privileged exclusively.","The field addresses contemporary wellbeing, not just history.","It does not automatically reject traditional healing."],"flag":""},{"id":3,"q":"Which of the following best describes Indigenous psychology as presented in the lecture module?","options":["A field that focuses only on clinical treatment without considering cultural context","A movement aimed at promoting global economic development in Indigenous communities","A global movement that supports Indigenous wellbeing and advocates for the right to self-determination","A discipline that replaces Indigenous cultural practices with standardized psychological approaches","A research area limited to studying historical Indigenous traditions without modern relevance"],"correct":2,"why":["Clinical treatment alone is too narrow.","Economic development is not its defining purpose.","Wellbeing and self-determination are central aims.","It aims to respect, not replace, cultural practices.","The field applies to contemporary research and care."],"flag":""},{"id":4,"q":"Why is it important to consider a group’s culture in psychological research and interventions?","options":["Because culture only influences religious practices and not behaviour","Because all groups respond the same way regardless of their cultural background","Because culture shapes people’s values, attitudes, beliefs, and influences how they think, feel, and behave","Because psychological research should avoid focusing on specific groups","Because culture is irrelevant when developing psychological treatments"],"correct":2,"why":["Culture affects more than religious behaviour.","Responses can differ across cultural contexts.","Values, beliefs and practices shape thought, emotion and behaviour.","Research can appropriately study specific communities.","Culture matters when designing interventions."],"flag":""},{"id":5,"q":"What issue in Western psychology is highlighted in the lecture module on Indigenous Psychology?","options":["It places too much emphasis on biological factors rather than social influences","It relies heavily on individual experiences and perspectives while often overlooking the influence of culture","It focuses exclusively on cultural differences without considering individual experiences","It avoids developing theories to explain human behaviour","It prioritises non-Western perspectives over Western viewpoints"],"correct":1,"why":["The critique concerns culturally narrow assumptions, not simply biology.","A Western individual-focused lens can overlook cultural context.","Western psychology does not exclusively study cultural differences.","Western psychology develops many theories.","Non-Western perspectives have often been underrepresented."],"flag":""},{"id":6,"q":"In Pavlov's experiments with dogs, salivation was which of the following?","options":["conditioned response.","unconditioned stimulus.","conditioned stimulus.","unconditioned response.","re-conditioned response."],"correct":null,"why":["Salivation to a learned bell is a conditioned response, so this could be correct.","Salivation is a response, not a stimulus.","Salivation is a response, not the conditioned stimulus.","Salivation to food without learning is an unconditioned response, so this could also be correct.","This is not a standard classical-conditioning term."],"flag":"Ambiguous: salivation is unconditioned when food elicits it, but conditioned when the learned bell elicits it. The question does not specify which."},{"id":7,"q":"In classical conditioning, learning is evident when which of following occurs?","options":["A stimulus automatically produces a response without a prior history of experience.","A stimulus which did not initially produce a response now elicits that response.","A spontaneously emitted response increases in frequency as a result of its consequences.","A subject repeats an action they have observed in another and is praised for it.","A subject suppresses an action they observed in another and is praised for it."],"correct":1,"why":["An unlearned reflex is not evidence of acquired conditioning.","A formerly neutral cue now triggers a learned response.","This describes operant learning through consequences.","This describes observation and reinforcement, not classical conditioning.","This likewise concerns observed action, not a learned stimulus association."],"flag":""},{"id":8,"q":"Which of the following is the best definition of operant conditioning?","options":["A type of learning that occurs through observation of others’ behaviours","A form of learning based on automatic responses to stimuli","A learning process involving voluntary behaviour that is shaped by consequences such as rewards or punishments","A method of learning that only involves unconscious reactions","A process where behaviour is determined entirely by genetic factors"],"correct":2,"why":["Observing models is observational learning.","Automatic reflex associations describe classical conditioning.","Voluntary acts are strengthened or weakened by consequences.","Operant conditioning need not be unconscious.","Genes do not fully determine operant behaviour."],"flag":""},{"id":9,"q":"Regeena gets caught speeding and as a result, loses their driver’s licence. As a result, Regeena never drives beyond the speed limit again. Which type of operant conditioning best desribes this scenario?","options":["Positive Punishment","Negative Punishment","Positive Reinforcement","Negative Reinforcement","Continuing Reinforcement"],"correct":1,"why":["Positive punishment adds something unpleasant; here something is removed.","Taking away a licence reduces speeding, so it is negative punishment.","Positive reinforcement adds a rewarding consequence and increases behaviour.","Negative reinforcement removes an aversive event to increase behaviour.","This is not a recognised schedule category."],"flag":""},{"id":10,"q":"A teacher takes their class to the library to work on an assignment but gets called away to monitor another teacher's class. Before leaving the class, the teacher tells the students: “I’ll be back every 10 minutes to check on you, ensure you behave”. Which of the following best describes the type of reinforcement schedule the teacher is engaging in to monitor the students’ progress?","options":["Random ratio","Fixed interval","Variable interval","Fixed ratio","Variable ratio"],"correct":1,"why":["A ratio schedule counts responses rather than time.","Predictable ten-minute checks correspond to fixed time intervals.","Variable intervals are unpredictable.","A fixed ratio is based on a fixed number of responses.","A variable ratio uses an unpredictable response count."],"flag":""},{"id":11,"q":"How many senses do humans have?","options":["Five","Six","Seven","Ten","More than twenty"],"correct":4,"why":["The familiar five-sense model omits many internal senses.","Six is still too restrictive for the lecture's broader count.","Seven remains too restrictive.","Ten remains below the lecture's broader count.","The lecture includes numerous internal and external sensory systems beyond the traditional five."],"flag":""},{"id":12,"q":"What is proprioception?","options":["The ability to detect external sounds and vibrations","The sense that allows the body to perceive its own position, movement, and coordination in space","The process of interpreting visual information from the eyes","The emotional response to physical sensations such as pain","The sense that allows perception of muscles stretching"],"correct":1,"why":["This describes hearing.","Proprioception tells us body and limb position and movement.","This describes visual perception.","An emotional reaction is not the position sense.","Muscle stretch contributes to proprioception, but this is narrower than the full sense."],"flag":""},{"id":13,"q":"What is transduction in the context of sensation and perception?","options":["The process of interpreting electrical signals in the brain","The conversion of physical stimuli into electrical signals that the brain can understand","The transmission of signals from the brain to the body’s muscles","The storage of sensory information in long-term memory","The filtering of irrelevant sensory information before it reaches the brain"],"correct":1,"why":["Interpreting signals is perception, not conversion.","Receptors transform physical energy into neural signals.","This describes a motor pathway, not sensory transduction.","Memory storage is a later process.","Attention filtering is different from transduction."],"flag":""},{"id":14,"q":"What is the key difference between Western and many Indigenous cultures in how they prioritise sensory experiences?","options":["Western cultures emphasise hearing, while Indigenous cultures focus on vision","Both Western and Indigenous cultures equally prioritise all senses","Western cultures prioritise vision, while many Indigenous cultures place greater importance on listening as a respectful and spiritual practice","Indigenous cultures do not use sensory information to understand the world","Western cultures rely only on touch, while Indigenous cultures rely only on sight"],"correct":2,"why":["This reverses the lecture's stated emphasis.","The module discusses differences in culturally valued sensing.","The lecture contrasts Western visual emphasis with respectful listening in many Indigenous traditions.","Indigenous communities use sensory information.","Neither culture is restricted to a single sensory modality."],"flag":""},{"id":15,"q":"Which statement best describes the concept of pitch in hearing?","options":["Pitch is determined by the loudness of a sound and measured in decibels","Pitch depends on the speed of light waves entering the ear","Pitch is determined by the frequency of sound waves, with higher frequencies producing higher pitches","Pitch refers to how long a sound lasts over time","Pitch is unrelated to the vibration of sound waves"],"correct":2,"why":["Decibels describe sound intensity, not pitch.","Light waves are unrelated to auditory pitch.","Higher sound-wave frequency normally produces higher pitch.","Duration is not pitch.","Sound-wave frequency determines pitch."],"flag":""},{"id":16,"q":"What challenge is associated with conducting twin and adoption studies?","options":["These studies require no ethical considerations and are easy to conduct","Participants are always easy to access and willing to share personal data","Adoption processes and privacy concerns can limit access to participants and make research more complex","Twin studies do not provide useful information for psychological research","Researchers are not concerned with participant well-being in these studies"],"correct":2,"why":["These studies have practical and ethical challenges.","Participants are not always accessible or willing.","Access and privacy make twin and adoption research difficult.","Twin comparisons help investigate genetic and environmental influence.","Researchers must consider participants' wellbeing and ethics."],"flag":""},{"id":17,"q":"What does the statement “personality traits are universal” imply?","options":["All people have identical personalities and behave in exactly the same way","Personality traits are only found in certain cultures and not others","Core personality traits exist in some form across all humans, regardless of cultural background","Personality traits are completely determined by environment and not shared across individuals","Only a few humans possess measurable personality traits"],"correct":2,"why":["Universal traits do not mean identical personalities.","Universality is not limited to one culture.","Broad trait dimensions can appear across people and cultures.","Neither environment alone nor identical expression follows from universality.","Trait differences can be assessed widely."],"flag":""},{"id":18,"q":"According to Eysenck’s theory, what explains differences in traits such as extraversion and introversion?","options":["Variations in childhood education and schooling experiences","Differences in levels of cortical arousal within the Ascending Reticular Activating System","The influence of peer groups and social environments only","Cultural expectations that shape personality traits","The amount of physical activity a person engages in daily"],"correct":1,"why":["Schooling is not Eysenck's proposed biological explanation.","Eysenck linked differences in extraversion to cortical arousal and ARAS.","Peers alone are not the biological mechanism in this theory.","Culture is not the specific mechanism asked about.","Exercise amount is not Eysenck's account of extraversion."],"flag":""},{"id":19,"q":"According to psychoanalytic theory, what influences much of our behaviour?","options":["Only our conscious thoughts and deliberate decisions","Social norms and expectations that we are fully aware of","Forces outside our conscious awareness that shape our thoughts and actions","Logical reasoning and problem-solving abilities alone","Immediate environmental situations without any internal influence"],"correct":2,"why":["Psychoanalysis emphasises more than conscious choices.","Fully conscious norms are not its key explanatory mechanism.","Unconscious drives and conflicts influence behaviour in psychoanalytic theory.","Reasoning alone does not explain behaviour in this approach.","It does not exclude inner mental forces."],"flag":""},{"id":20,"q":"Teema has been for five job interviews in the last five weeks but has not been successful at securing the job in any of them. Nonetheless, Teema knows that they have the technical skills and experience to secure a job in their field and is convinced they will eventually get a job. Which of the following describes Teema’s experience in trying to secure a job?","options":["Teema has an external locus of control","Teema has experienced negative punishment","Teema has an internal locus of control","Teema has set SMART goals","Teem has experienced positive punishment"],"correct":2,"why":["External locus attributes outcomes mainly to outside forces.","No desirable item has been removed as punishment.","Confidence in one's own ability and agency best matches internal control here.","The scenario gives no properly specified SMART goal.","No unpleasant consequence was added as punishment."],"flag":""},{"id":21,"q":"What is the primary purpose of the Rorschach Inkblot Test?","options":["To measure intelligence through problem-solving tasks","To assess physical reflexes in response to visual stimuli","To evaluate personality and emotional functioning based on interpretations of ambiguous images","To determine memory capacity using visual patterns","To test visual acuity and perception accuracy"],"correct":2,"why":["The inkblot test is not an IQ test.","It is not a reflex test.","It uses interpretations of ambiguous inkblots in projective personality assessment.","It is not a memory-span procedure.","It is not an eye examination."],"flag":""},{"id":22,"q":"If a psychological assessment tool is used to measure a stable characteristic, like a personality trait, but it yields varying results each time it is administered to the same person, which of the following is correct regarding the tool?","options":["It has poor validity","It has poor reliability","It has poor inter-rater reliability","It has good variability","It has poor response validity"],"correct":1,"why":["Validity concerns whether the intended construct is measured; inconsistency directly signals reliability.","Different results for a stable trait show poor test–retest reliability.","No disagreement between raters was described.","Unstable scores are not a desirable measure of variability.","Response validity was not the issue described."],"flag":""},{"id":23,"q":"Shawna claims they are very good at determining someone’s personality by examining the shape of their body. Which theory reflects Shawna’s approach to personality?","options":["Psychoanalytic Theory","Embodiment Theory","Phrenology","Somatotype Theory","Evolutionary Theory"],"correct":3,"why":["Psychoanalysis focuses on unconscious mental processes.","Embodiment concerns mind–body relations but is not the claimed body-build classification.","Phrenology infers traits from skull features, not overall body shape.","Somatotype theory links bodily build with personality.","Evolutionary theory is not a body-shape reading system."],"flag":""},{"id":24,"q":"What is the purpose of standardisation in psychological assessment?","options":["To allow each examiner to administer the test in their own preferred way","To ensure that assessments are flexible and change depending on the participant","To guarantee that the assessment is administered, scored, and interpreted consistently using clear instructions and methods","To make tests more difficult for participants to complete","To focus only on the interpretation of results without considering how the test is given"],"correct":2,"why":["Different procedures undermine consistency.","Ad hoc changes oppose standardisation.","Same instructions, scoring and interpretation improve comparability.","Making items difficult is not the purpose.","Standardisation applies to administration as well as scoring and interpretation."],"flag":""},{"id":25,"q":"Ryker loves red cars and his attention is always drawn to them. When his parents take Ryker out for a bike ride, he remarks that there are so many red cars on the road today. Without even counting the number of red vs non-red cars there are, Ryker confidently proclaims that there are definitely more red cars on the road today. Which of the following phenomena best explains Ryker’s behaviour?","options":["Self-fulfilling prophecy","Confirmation bias","Redistribution bias","False logic","Illusory Bias"],"correct":1,"why":["A self-fulfilling prophecy would change behaviour to produce an expected outcome.","Selective attention to confirming examples supports a pre-existing belief.","This is not a recognised account of the scenario.","Vague faulty logic does not identify the selective evidence mechanism.","The named bias does not explain the selective confirmation as well."],"flag":""},{"id":26,"q":"Jill has just finished night shift at the Emergency Department and is keen to go home and sleep. On the way home, Jill remembers to stop and buy milk. Which of the following reflects the type of memory Jill used to remember to buy milk on the way home?","options":["Short-term memory","Procedural memory","Prospective memory","Semantic memory","Episodic memory"],"correct":2,"why":["Short-term memory concerns brief current holding, not remembering a future intention.","Procedural memory stores learned skills.","Prospective memory is remembering to carry out an intended action later.","Semantic memory is general factual knowledge.","Episodic memory is recall of personal past events."],"flag":""},{"id":27,"q":"Which of the following is true about what happens after information is held in sensory memory?","options":["It is immediately stored in long-term memory permanently","It is transferred from sensory memory to the short-term memory store","It is forgotten instantly without any further processing","It is sent directly to the motor system for action","It bypasses short-term memory and is stored unconsciously"],"correct":1,"why":["Sensory information is not automatically made permanent.","Attended information can pass from sensory to short-term memory in the multistore model.","Some information can be attended to, so it is not all immediately lost.","A motor response is not the storage pathway asked about.","This is not the multistore model's stated sequence."],"flag":""},{"id":28,"q":"Poitr is given a test to see how many single digit numbers they can remember. Based on research findings, which type of memory would Poitr use to complete this test and how many digits are they likely to remember?","options":["Sensory memory will be used; 5 digits will be remembered","Sensory memory will be used; 6 digits will be remembered","Short-term memory will be used; 7 digits will be remembered","Short-term memory will be used; 8 digits will be remembered","short-term memory will be used; 9 digits will be remembered"],"correct":2,"why":["Sensory memory is not the intended digit-span store.","Sensory memory is not the intended digit-span store.","The classic estimate is about seven items in short-term memory.","Eight is not the classic central estimate.","Nine is near the upper end of 7 ± 2, not the typical estimate asked."],"flag":""},{"id":29,"q":"Which statement best describes a characteristic of long-term memory?","options":["Information can only be accessed while attention is actively focused on it","It stores information only for a few seconds before it is forgotten","It retains information that cannot be retrieved once attention shifts away","Information can be retrieved even after attention has shifted to something else","It only stores sensory information from the environment"],"correct":3,"why":["Long-term memory need not remain in current attention.","A few seconds characterises shorter-term storage.","Long-term memory can often be retrieved later.","Stored information can be retrieved after attention shifts.","It contains more than raw sensory traces."],"flag":""},{"id":30,"q":"Marta had her memory tested by being asked to recall a list of 25 objects that were read out to her, one word per second. The serial position effect indicates that Marta will likely remember which of the objects that were read out to her?","options":["Only the objects that appeared at the start of the list","Only the objects that appeared at the end of the list","Only the objects that appeared in the middle of the list","Only the objects that appeared at the start and end of the list","Only the objects that appeared at middle and end of the list"],"correct":3,"why":["Primacy alone ignores recency.","Recency alone ignores primacy.","Middle items are typically recalled less well.","Serial-position curves show primacy and recency advantages.","A beginning effect is missing from this choice."],"flag":""},{"id":31,"q":"Cattlell’s experiments on memory were influential to the field of forensic psychology for which following reasons?","options":["They demonstrated eyewitness memory for previous events was malleable","They demonstrated eyewitness memory for previous events was usually very accurate","They demonstrated eyewitness memory for previous events should be treated with caution","They demonstrated eyewitness memory for previous events was reliable if the witness was confident in their memory","They demonstrated eyewitness memory for previous events was stored in long- term memory."],"correct":2,"why":["Malleability is associated more specifically with later distortion research.","Cattell's findings did not establish widespread accuracy.","His findings raised doubts about eyewitness accuracy and confidence.","Confidence alone did not make recollection accurate.","Long-term storage was not the central forensic lesson."],"flag":""},{"id":32,"q":"What was the impact of Henry H. Goddard’s ideas about intelligence testing?","options":["They improved educational outcomes for all individuals without negative consequences","They encouraged equal treatment and inclusion of all people in society","They led to unjust practices such as incarceration and sterilisation based on misguided beliefs about intelligence and criminality","They focused only on improving mental health services in prisons","They had no influence on social or legal policies"],"correct":2,"why":["These ideas had severe discriminatory consequences.","They did not simply encourage equal inclusion.","Misuse of testing contributed to institutionalisation and forced sterilisation.","Their impact extended beyond prison mental-health services.","They influenced social and legal practices."],"flag":""},{"id":33,"q":"What was a key impact of Elizabeth Loftus’s research on memory?","options":["It proved that human memory is always accurate and cannot be changed","It showed that memories can be distorted by misinformation, leading to improved interviewing techniques and legal reforms","It focused only on studying memory in children without real-world applications","It demonstrated that eyewitness testimony is always reliable in court cases","It eliminated the use of memory evidence in legal systems entirely"],"correct":1,"why":["Loftus found memory can be changed after events.","Post-event misinformation can distort eyewitness recall, informing better procedures.","Her work extends beyond only childhood memory.","Eyewitness accounts are not always reliable.","Her research did not remove all memory evidence from court."],"flag":""},{"id":34,"q":"What factor/s can influence how information is encoded when witnessing an event?","options":["Only the visual details present at the scene","A person’s attention, focus, and emotional state during the event","The time of day, regardless of the person’s mental state","The type of crime, with no influence from the observer","The memory storage system alone, without involvement of perception"],"correct":1,"why":["Encoding depends on the witness, not only visible features.","Attention and emotional state can alter encoding.","Time of day alone does not eliminate mental-state effects.","The observer's processes influence encoding.","Perception and attention are involved before storage."],"flag":""},{"id":35,"q":"In forensic psychology, which of the following is an estimator variable?","options":["The interrogation technique investigators use to question a suspect","The weather during the event of a crime","The number of people who witness a crime","The number of people who agree to give witness statements","The number of people who refuse to give witness statements"],"correct":1,"why":["Interview technique is a controllable system variable.","Weather during witnessing is an event condition outside investigator control.","Witness count does not as directly identify the environmental estimator factor targeted here.","Statement participation is a later procedural outcome, not the weather at encoding.","Refusal to provide statements is not the event-condition estimator asked."],"flag":""},{"id":36,"q":"How can misinformation become part of a person’s memory of an event?","options":["It only occurs when individuals deliberately try to change their memory","It can enter through sources such as news, conversations, or interview techniques and become integrated without the person realising","It only comes from the original event and cannot be altered afterward","It affects only people with weak memory abilities","It is limited to visual details and does not affect other senses"],"correct":1,"why":["Misinformation need not be intentional.","Later media, conversation and questioning can alter remembered details.","Post-event information can affect recall.","It can affect ordinary witnesses.","Misleading information is not restricted to vision."],"flag":""},{"id":37,"q":"What is the main risk associated with leading questions when investigators are interviewing witnesses?","options":["They may create overconfidence in accurate memories without affecting recall","They may have little to no influence on a witness’s recollection of events","They may introduce misleading and/or incorrect details that become incorporated into a witness’s memory","They may only pose a risk to witnesses who already had poor memory abilities","They may cause witnesses to reveal less information about what they saw"],"correct":2,"why":["Leading questions can change content, not just confidence.","They can influence reported memory.","Suggested false details can become part of the account.","The risk is not restricted to already weak rememberers.","The key risk is distortion, not simply less detail."],"flag":""},{"id":38,"q":"Which of the following is true regarding the use of prompts to facilitate memory recall when police conduct interviews with eyewitnesses?","options":["Prompts should not be used in police interviews because they are likely to create false memories","Prompts should not be used in police interviews because they confuse witnesses","Prompts should only be used when witnesses are attempting to recall an event that happened a long time ago","Prompts can be used to help witness recall accurate memories","Prompts will cause witnesses to recall inaccurate memories"],"correct":3,"why":["Appropriate non-leading prompts can help recall.","Not all prompts confuse witnesses.","Prompts can be useful regardless of how long ago an event occurred.","Helpful retrieval cues may facilitate accurate remembering.","Prompts do not necessarily produce inaccurate recall."],"flag":""},{"id":39,"q":"What is a benefit of asking witnesses to recall events in different sequences to which they occurred?","options":["It increases the likelihood of witnesses guessing the correct details to fill gaps in memory","It may help witnesses to forget any false memories for the event","It may help uncover additional details and reveal inconsistencies","It ensures that witnesses provide identical accounts of the event every time","It guarantees that all recalled details will be completely accurate"],"correct":2,"why":["The aim is more complete retrieval, not guessing.","Changing order does not magically erase false recollections.","Different retrieval sequences can uncover details and inconsistencies.","Recall is not guaranteed to be identical.","No method guarantees completely accurate recall."],"flag":""},{"id":40,"q":"Which of the following are effective techniques for facilitating the retrieval of an eyewitness’ memory?","options":["Asking open-ended questions and using leading questions","Asking open-ended questions and avoiding leading questions","Building rapport and asking closed questions","Building rapport and using leading questions","Building rapport and not providing retrieval cues"],"correct":1,"why":["Leading questions can contaminate recall.","Open-ended, non-leading questions reduce suggestion.","Rapport helps, but closed questions can unnecessarily restrict the initial account.","Leading questions remain problematic even with rapport.","Appropriate retrieval cues can be beneficial."],"flag":""},{"id":41,"q":"What are the five aims of organisational psychology?","options":["Accountability, Effectiveness, Fairness, Safety, and Wellbeing","Effectiveness, Fairness, Safety, Sustainability, and Wellbeing","Effectiveness, Responsibility, Safety, Sustainability, and Teamwork","Accountability, Fairness, Safety, Teamwork, and Wellbeing","Effectiveness, Honesty, Safety, Sustainability, and Wellbeing"],"correct":1,"why":["Accountability replaces sustainability here, so this is not the lecture's five.","The five aims are effectiveness, fairness, safety, sustainability and wellbeing.","Responsibility and teamwork are not the five named aims.","Accountability and teamwork replace two named aims.","Honesty is valuable but not the named fifth aim."],"flag":""},{"id":42,"q":"To resolve workplace issues, an organisational psychologist will use which four levels of analyses?","options":["Individual, Team, Leadership, and Governance","Individual, Team, Leadership, and System","Individual, Team, Process, and Governance","Individual, Process, Leadership, and System","Individual, Team, Leadership, and System"],"correct":null,"why":["Governance is not the fourth listed level.","This exactly names the four levels in the lecture, but option E repeats it.","Process and governance replace leadership and system.","This leaves out the team and leadership levels.","This is identical to option B, so both are correct as printed."],"flag":"The original PDF prints exactly the same correct wording twice (original B and E), so a single correct option cannot be distinguished."},{"id":43,"q":"A manager of a café in Newtown that their casual employees are asking to finish shifts early, taking longer breaks, and are not serving customers in a friendly manner anymore. Which of the following aims of organisational psychology can help things improve?","options":["Effectiveness","Fairness","Safety","Sustainability","Wellbeing"],"correct":0,"why":["Reduced customer service and poor performance point most directly to effectiveness.","Fairness involves equitable treatment and bias; this is not the focus given.","Safety concerns physical and psychological hazards rather than service performance specifically.","Sustainability considers longer-term viability; no clear evidence makes it the best here.","Wellbeing might also matter, but the described immediate outcome is poor functioning."],"flag":""},{"id":44,"q":"How does health psychology explain the impact of workplace factors on health?","options":["Workplace health is determined only by physical hazards, not psychological or social factors","Health psychology focuses only on individual illness, without considering work environments","Job demands, relationships, and working conditions can influence employees’ stress, illness, and recovery over time","Physical health in the workplace is unrelated to mental health or stress","Workplace conditions affect only short-term wellbeing and not long-term health"],"correct":2,"why":["Health psychology includes psychosocial conditions.","Work environment is relevant to health.","Demands and relationships affect stress, illness and recovery.","Mental and physical health can interact.","Effects may accumulate over time."],"flag":""},{"id":45,"q":"According to sensation and perception research, what is a potential impact of environmental conditions in the workplace?","options":["Environmental factors such as noise and lighting have little to no effect on performance or wellbeing","Workplace performance is determined only by employee motivation, not physical surroundings","Physical conditions only affect long-term health and not daily functioning","Poor conditions like bad lighting, noise, and discomfort can negatively affect how people feel and perform at work","Environmental factors influence only physical health and not mental focus or wellbeing"],"correct":3,"why":["Noise, lighting and comfort can affect performance.","Motivation is not the only determinant.","Conditions also affect day-to-day functioning.","Poor physical environments can disrupt mood, attention and performance.","Environment influences both mental and physical functioning."],"flag":""},{"id":46,"q":"Which of the following are examples of social motives (secondary) motives?","options":["Thirst and curiosity","Sleep and play","Sex and power","Hunger and aggression","Power and autonomy"],"correct":4,"why":["Thirst is a primary biological motive.","Sleep is a biological need.","Sex is commonly treated as a biological motive.","Hunger is a biological motive.","Power and autonomy are learned/social motives in this framing."],"flag":""},{"id":47,"q":"Research on the impact of watching a motivational speaker has concluded which of the following?","options":["People develop new sustainable habits that improve their wellbeing in the long term","People develop new sustainable habits that improve their wellbeing in the short term","People experience a temporary boost in biological drivers (e.g., adrenaline) which do not translate into any long-term benefits","People experience a boost in biological drivers (e.g., adrenaline) which translates into long-term benefits","People experience a temporary boost in social drivers (e.g., achievement) which do not translate into any long-term benefits"],"correct":2,"why":["A lasting habit change is not established by a single inspirational talk.","The question concerns temporary arousal rather than sustainable habits.","Short-term biological arousal may not sustain long-term motivation.","A lasting change is not established.","The lecture's description emphasises temporary biological activation rather than this claimed social mechanism."],"flag":""},{"id":48,"q":"Which of the following are true regarding drive reduction theories?","options":["Humans are motivated to maintain a psychological equilibrium","Humans are motivated to maintain a familial bond","Humans are motivated to avoid homeostasis","Humans are motivated to disrupt a psychological equilibrium","Humans are motivated to resist urges to reduce internal, unpleasant state"],"correct":null,"why":["Homeostasis is primarily physiological balance; 'psychological equilibrium' is imprecise and may be the intended option.","Family bonding is a different kind of motive.","Drive reduction seeks to restore, not avoid, homeostasis.","Drive reduction does not aim to disrupt balance.","Drive reduction aims to ease unpleasant needs, not resist reducing them."],"flag":"Drive reduction concerns restoring physiological homeostasis. The closest printed choice says “psychological equilibrium,” which is imprecise."},{"id":49,"q":"What does the Yerkes-Dodson Law suggest about the relationship between arousal and performance?","options":["Performance decreases steadily as arousal increases","Performance is best when arousal levels are extremely low","Performance improves with arousal up to an optimal point, after which further arousal leads to a decline in performance","Arousal has no effect on performance in any type of task","High levels of arousal always produce the best performance outcomes"],"correct":2,"why":["Performance does not decline at every rise in arousal.","Very low arousal is not generally optimal.","Performance often follows an inverted-U with a moderate optimum.","Arousal can change task performance.","Excessive arousal can impair performance."],"flag":""},{"id":50,"q":"What was a key finding from the sensory deprivation experiments conducted by Zuckerman & Hopkins (1966)?","options":["Participants showed no psychological or perceptual changes during sensory deprivation","Participants experienced enhanced concentration and improved cognitive performance","Many participants reported unusual perceptual experiences, including hallucinations and visual sensations","Sensory deprivation led to permanent improvements in memory and attention","Only participants with prior training could tolerate sensory deprivation without effects"],"correct":2,"why":["The experiments reported effects from reduced stimulation.","Enhanced concentration is not the cited finding.","Participants experienced unusual perceptual experiences under deprivation.","Permanent memory gains were not demonstrated.","Training was not the necessary condition described."],"flag":""},{"id":51,"q":"What was a key finding of Lepper, Greene, and Nisbett (1973) regarding motivation?","options":["Extrinsic rewards always increase a person’s interest in a task","Intrinsic and extrinsic motivation always work together to improve performance","People are only motivated by rewards and not by enjoyment","Extrinsic reinforcement has no effect on motivation","Intrinsic motivation can be weakened when external rewards are introduced for an activity that was already enjoyable"],"correct":4,"why":["Rewards do not invariably increase intrinsic interest.","The two motives do not always add together harmlessly.","People can be motivated by enjoyment.","External rewards can alter interest.","Expected rewards can undermine initial intrinsic motivation: the overjustification effect."],"flag":""},{"id":52,"q":"According to Maslow’s hierarchy of needs, what is the focus of the third level of needs?","options":["Achieving personal growth and reaching one’s full potential","Securing safety, stability, and protection from harm","Developing close relationships, including friendships, family connections, and a sense of belonging","Gaining respect, recognition, and high self-esteem","Fulfilling basic physiological needs such as food and shelter"],"correct":2,"why":["Self-actualisation is level five.","Safety is level two.","Love, belonging and close connection make up the third level.","Esteem is level four.","Physiological requirements are level one."],"flag":""},{"id":53,"q":"Research on the impact of ageing on sexual behaviour indicates which of the following is true?","options":["As age increases, sexual frequency decreases but sexual satisfaction remains stable","As age increases, both sexual frequency and sexual satisfaction decrease","As age increases, both sexual frequency and sexual satisfaction increases","As age increases, sexual frequency increases but sexual satisfaction decreases","As age increases, sexual frequency decreases but sexual satisfaction increases"],"correct":0,"why":["The lecture reports declining frequency with satisfaction often staying high.","A decline in satisfaction is not inevitable.","The lecture does not report both consistently increasing.","Frequency does not generally increase with ageing.","Satisfaction does not necessarily increase as frequency declines; remaining stable is the supported point."],"flag":""},{"id":54,"q":"Jean is a university student who sets a goal to achieve a High Distinction on their research presentation assessment which was due on the last day of Week 9. However, they fail to meet this goal because it was not properly aligned with the SMART goals criteria. Based on the information provided, which element of the SMART goals was not properly set?","options":["The goal was not specific","The goal was not measurable","The goal focused on the outcome instead of actions","The goal was unrealistic","The goal did not include a clear deadline for completion"],"correct":null,"why":["Specific: the grade target is quite specific.","Measurable: a High Distinction is an assessable outcome.","Action-focused goals can help, but 'action-focused' is not itself one of the five SMART letters.","The scenario does not establish the goal is unrealistic.","A due date is explicitly supplied, so timing is present."],"flag":"The goal gives a specific grade, a measure and a deadline. The question does not establish that it is unrealistic; “outcome rather than actions” is not one of the five SMART initials."},{"id":55,"q":"Which of the following research findings are true regarding the libido of males and females?","options":["Females do not like masturbating as much as males","Females want to have sex earlier in relationships than males","Females have more varied sexual fantasies than males but are less likely to fulfill them compared to males","Males masturbate more frequently and want more sexual partners than females","Males desire sex more frequently than females but females have more sexual fantasies than males"],"correct":null,"why":["The lecture reports average behaviour frequencies, not enjoyment as such.","The lecture does not establish this relationship timing claim.","The lecture does not establish this fantasy comparison.","The lecture supports men reporting more frequent masturbation, but its supplied text does not verify the partner-number claim.","The lecture does not support a female advantage in fantasy frequency."],"flag":"The original options lack a fully lecture-confirmed answer. The lecture mentions average sex differences in desire and masturbation, but does not verify the extra number-of-partners claim in the closest option."},{"id":56,"q":"What is the key difference between descriptive and inferential statistics?","options":["Descriptive statistics explain causes of behaviour, while inferential statistics summarise data","Descriptive statistics summarise and organise data, while inferential statistics draw conclusions and make predictions about a larger population","Descriptive statistics are only used in experiments, while inferential statistics are only used in surveys","Descriptive statistics focus on future outcomes, while inferential statistics focus only on past data","Descriptive statistics are describe complex patterns found in a dataset whereas inferential statistics are used to describe simple patterns found in a dataset"],"correct":1,"why":["This reverses the roles of the two types.","Descriptive methods summarise observed data; inference generalises beyond samples.","Neither type is restricted to those study designs.","The split is not future versus past.","Complexity is not the difference between descriptive and inferential statistics."],"flag":""},{"id":57,"q":"What is the key difference between a conceptual definition and an operational definition of a psychological construct?","options":["A conceptual definition explains what a construct means in theory, while an operational definition explains how it is measured or observed in practice","A conceptual definition describes how to measure a construct, while an operational definition explains its meaning","Conceptual definitions are only used in experiments, while operational definitions are only used in surveys","Conceptual definitions are based on numerical variables, while operational definitions are based on categorical variables","Conceptual definitions are based on categorical variables, while operational definitions are based on numerical variables"],"correct":0,"why":["Conceptual means theoretical meaning; operational means measured procedure.","These definitions are reversed.","Both types can be used with many research methods.","Both definitions can apply to categorical or numerical constructs.","The distinction is not whether the data are categorical versus numeric."],"flag":""},{"id":58,"q":"What is the key difference between an extraneous variable and a confounding variable in research?","options":["An extraneous variable has no effect on results, while a confounding variable strengthens the relationship between variables","A confounding variable only affects independent variables, while an extraneous variable only affects participants","An extraneous variable is deliberately manipulated, while a confounding variable is ignored","Extraneous and confounding variables are the same and have identical effects in research","An extraneous variable influences the dependent variable, while a confounding variable systematically affects the results and makes it difficult to determine cause and effect"],"correct":4,"why":["Extraneous variables may affect the outcome; confounders have systematic associations.","Confounders can affect the outcome as well, not just the independent variable.","The manipulated variable is the independent variable.","A confound has a specific systematic role, unlike any extraneous variable.","Systematic co-variation makes cause-and-effect attribution difficult."],"flag":""},{"id":59,"q":"Which of the following factor/s are true regarding dependent variables?","options":["They are the variables that are deliberately manipulated by the researcher","They are always controlled to eliminate their effects on results","They remain constant and are not influenced by other variables","They are the outcomes or responses that are measured in a study","They cause changes in the independent variable"],"correct":3,"why":["The independent variable is manipulated.","Dependent variables are outcomes, not necessarily controlled constants.","Outcomes can vary across conditions.","The dependent variable is the response measured.","The proposed direction reverses the usual relationship."],"flag":""},{"id":60,"q":"A boxplot can be used to summarise which types of variables?","options":["Nominal and ordinal variables","Nominal and ratio variables","Interval and ratio variables","Ordinal and categorical variables","Qualitative and nominal variables"],"correct":2,"why":["Nominal categories are not suitable for numeric boxplots.","Nominal categories cannot themselves form a numeric boxplot distribution.","Interval and ratio values are quantitative and support quartiles and boxplots.","Categorical labels are not continuous distributions.","Qualitative/nominal variables are not the required numerical type."],"flag":""},{"id":61,"q":"Which of the following is the correct definition of central tendency?","options":["A measure that describes how spread out data values are in a dataset","A method used to determine cause-and-effect relationships between variables","A process used to collect data from participants in a study","A summary statistic that represents the centre or typical value of a dataset","A way of identifying extreme values or outliers in a dataset"],"correct":3,"why":["Spread is variability, not centre.","Causal analysis is not a central-tendency statistic.","Data collection is a research procedure.","Central tendency represents a typical or central value.","Identifying outliers is not the definition of central tendency."],"flag":""},{"id":62,"q":"In statistics, which of the following is the correct description of the median?","options":["The value that appears most frequently in a dataset","The average value calculated by adding all values and dividing by the number of values","A measure that shows how spread out the data values are","The difference between the highest and lowest values in a dataset","The middle value in a dataset when the values are arranged in order"],"correct":4,"why":["This is the mode.","This is the arithmetic mean.","This is a measure of dispersion.","This is the range.","Median is the ordered middle value, or average of the two middles."],"flag":""},{"id":63,"q":"In statistics, which of the following is the correct description of a normal distribution?","options":["A distribution where all values are evenly spread with no central peak","A symmetric, bell-shaped distribution where most values cluster around the mean and fewer values appear at the extremes","A distribution where values are skewed heavily to one side","A graph that only displays categorical data","A distribution where most values range between 40 and 60"],"correct":1,"why":["A uniform distribution is not bell-shaped.","Normal data are symmetric with the highest density near the mean.","This is a skewed distribution.","A normal distribution describes numerical values, not categorical-only graphs.","Normality has no fixed 40–60 range."],"flag":""},{"id":64,"q":"In statistics, which of the following is the correct description of kurtosis?","options":["A measure of how spread out the data values are in a dataset","A measure of the direction and degree of skewness in a distribution","The difference between the highest and lowest values in a dataset","The midpoint value that divides a dataset into two equal halves","A measure of the “tailedness” or how peaked or flat a distribution is compared to a normal distribution"],"correct":4,"why":["Spread is variability, not kurtosis.","Direction of asymmetry describes skewness.","Maximum minus minimum is the range.","A central midpoint describes the median.","Kurtosis concerns tail behaviour, often introduced via peakedness/flatness relative to normal."],"flag":""},{"id":65,"q":"Which of the following are correct regarding the empirical rule?","options":["Approximately 50% of scores fall within 1 standard deviation of the mean","Approximately 50% of scores fall within 2 standard deviations of the mean","Approximately 68% of scores fall within 1 standard deviation of the mean","Approximately 68% of scores fall within 2 standard deviations of the mean","Approximately 99% of scores fall within 2 standard deviations of the mean"],"correct":2,"why":["The within-one-SD figure is about 68%, not 50%.","Within two SDs is about 95%, not 50%.","The empirical rule gives about 68% within one standard deviation.","About 95%, not 68%, lie within two standard deviations.","About 99.7% are within three SDs; two SDs covers about 95%."],"flag":""},{"id":66,"q":"A researcher randomly invites commuters entering or exiting Central Train Station on Friday mornings to complete a survey about their train experiences. Why will this method not result in a representative sample of all train users?","options":["The sample is too large to accurately reflect the population","The commuters are likely to refuse participation, making the data invalid","The sample uses random selection, which reduces accuracy","The survey focuses on too many variables at once","The sample only includes people at one location and time, excluding those who travel on other days, times, or stations"],"correct":4,"why":["Large samples are not inherently unrepresentative.","Nonresponse may matter but is not the main demonstrated flaw.","Random selection within a restricted location/time cannot fix the sampling-frame limit.","Number of variables is not the reason for bias.","One station and Friday mornings omit other users and times."],"flag":""},{"id":67,"q":"What are the two key principles that must be observed to ensure a representative sample is selected for a study?","options":["Interdependent probability and adequate probability","Interspersed probability and adequate probability","Interdependent probability and sufficient probability","Independent probability and equal probability","Interdependent probability and interspersed probability"],"correct":3,"why":["Interdependence is not the target sampling principle.","'Interspersed probability' is not the named principle.","These terms do not state independent and equal chances.","Independent, equal chances help random selection represent the population.","These terms are not the relevant sampling principles."],"flag":""},{"id":68,"q":"Which of the following is true regarding the impact of the Central Limit Theorem?","options":["The distribution of a population will be approximately normal","The sampling distribution will be positively skewed","The distribution of a population will be negatively skewed","The sampling distribution will be approximately normal","The sampling distribution will be leptokurtic"],"correct":3,"why":["The theorem does not force the original population to be normal.","The sampling distribution need not be positively skewed.","The theorem does not change the original population's skewness.","Under suitable conditions, the sampling distribution of the mean tends toward normality.","Leptokurtosis is not its main conclusion."],"flag":""},{"id":69,"q":"Which of the following is true regarding hypothesis testing?","options":["If the null hypothesis is rejected, the alternative hypothesis is tentatively accepted","If the null hypothesis is accepted, the alternative hypothesis is tentatively accepted","Accepting the alternative hypothesis signals that a researcher has proven their prediction is true","Rejecting the null hypothesis is a better outcome than rejecting the alternative hypothesis","Accepting the alternative hypothesis is a better outcome than rejecting the alternative hypothesis"],"correct":0,"why":["Rejecting the null gives evidence supporting the alternative, not certainty.","Failing to reject the null does not establish the alternative.","Statistical evidence does not prove a prediction.","There is no universal preference for rejecting a given hypothesis.","The wording incorrectly treats one result as inherently better."],"flag":""},{"id":70,"q":"In a court case, a jury incorrectly convicts a defendant of murder. Which type of error does this represent?","options":["Type I error","Type II error","Base rate neglect","A sampling distribution error","A sampling error"],"correct":0,"why":["With a null presumption of innocence, wrongful conviction is a false positive (Type I).","Type II would fail to convict a guilty person under that analogy.","Base-rate neglect is a reasoning error, not the labelled hypothesis-testing outcome.","No sampling distribution is specified.","Sampling error is not the decision error in the analogy."],"flag":""}];
const N=BANK.length;
let mode='home',run=[],position=0,answered=[],chosen=null,done=false,reviewMode=null;
const el=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function randomIndex(n){if(globalThis.crypto&&typeof crypto.getRandomValues==='function'){const a=new Uint32Array(1),range=4294967296,lim=range-(range%n);do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n}return Math.floor(Math.random()*n)}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){let j=randomIndex(i+1);[b[i],b[j]]=[b[j],b[i]]}return b}
function scrollTop(){window.scrollTo({top:0,behavior:'instant'})}
function makeRun(ids){run=shuffle(ids.map(id=>{const q=BANK.find(x=>x.id===id);return {...q,order:shuffle([0,1,2,3,4])}}));position=0;answered=[];chosen=null;done=false;mode='quiz';render();scrollTop()}
function score(){return answered.filter(a=>a.correct===true).length}
function graded(){return answered.filter(a=>a.correct!==null).length}
function uncertain(){return answered.filter(a=>a.correct===null).length}
function storeScore(){try{if(run.length===N)localStorage.setItem('psyu1101_professor_practice_last',JSON.stringify({score:score(),graded:graded(),total:N,date:new Date().toISOString()}))}catch(e){}}
function lastScore(){try{let s=JSON.parse(localStorage.getItem('psyu1101_professor_practice_last'));if(s)return `${s.score}/${s.graded} graded questions (${s.total} presented)`}catch(e){}return 'No completed full attempt yet'}
function home(){mode='home';render();scrollTop()}
function render(){if(mode==='home')return renderHome();if(mode==='quiz')return renderQuestion();if(mode==='results')return renderResults();if(mode==='review')return renderReview()}
function renderHome(){el.innerHTML=`<section class="panel"><span class="pill">70 original MCQs</span><h2 style="margin-top:13px">Ready to practise?</h2><p>Questions and choices are shuffled independently on each attempt. Feedback appears immediately after you select an answer.</p><p class="small"><b>Last full-test score:</b> ${esc(lastScore())}</p><button class="btn full" id="start">Start 70-question test</button></section><section class="panel"><h3>Answer-key status</h3><p>The attached practice PDF does <b>not</b> include an answer key. Answers and explanations here were worked out from the supplied lecture material, not supplied by the professor.</p><div class="notice"><b>5 questions are not scored:</b> the PDF contains ambiguous wording, duplicate correct options, or unsupported distinctions. They are still presented exactly as printed, with explanations and a review notice. See them in the results review.</div><p class="footer-note">Single HTML file • no internet, account or external resources needed. The last full-test score is stored on this device only when browser storage permits.</p></section>`;document.getElementById('start').onclick=()=>makeRun(BANK.map(q=>q.id))}
function renderQuestion(){let q=run[position],a=answered[position],locked=!!a,corr=q.correct;const progress=(position+1)/run.length*100;
 let options=q.order.map((orig,idx)=>{let cls='',suffix='';if(locked){if(corr===null){if(orig===a.choice)cls='uncertain'}else{if(orig===corr){cls='correct';suffix=' ✓ Correct answer'}else if(orig===a.choice){cls='wrong';suffix=' ✕ Your answer'}}}return `<button class="opt ${cls}" data-option="${orig}" ${locked?'disabled':''}><span class="letter">${'ABCDE'[idx]}</span><span class="value">${esc(q.options[orig])}${suffix?`<span class="small">${suffix}</span>`:''}</span></button>`}).join('');
 let explain='';if(locked){if(corr===null){explain=`<div class="explain warning"><b>Answer cannot be scored reliably</b><p>${esc(q.flag)}</p><p><b>Your selected answer:</b> ${esc(q.options[a.choice])}</p><p><b>About that option:</b> ${esc(q.why[a.choice])}</p><p class="small">This question is not counted as correct or incorrect.</p></div>`}else if(a.correct){explain=`<div class="explain good"><b>Correct!</b><p>${esc(q.why[corr])}</p></div>`}else{let idx=q.order.indexOf(corr);explain=`<div class="explain bad"><b>Not quite.</b><p><b>Why your choice is wrong:</b> ${esc(q.why[a.choice])}</p><p><b>Correct answer: ${'ABCDE'[idx]}.</b> ${esc(q.options[corr])}</p><p><b>Why it is right:</b> ${esc(q.why[corr])}</p></div>`}}
 const allReasons=locked?`<details style="margin-top:18px"><summary style="cursor:pointer;font-weight:750;padding:10px 0">See justification for all five options</summary>${q.order.map((orig,idx)=>`<p><b>${'ABCDE'[idx]}.</b> ${esc(q.why[orig])}</p>`).join('')}</details>`:'';
 el.innerHTML=`<section class="panel"><div class="stats"><span class="stat">Question ${position+1}/${run.length}</span><span class="stat">Live score: ${score()}/${graded()} graded</span></div><div class="bar" role="progressbar" aria-label="Quiz progress" aria-valuenow="${position+1}" aria-valuemin="0" aria-valuemax="${run.length}"><div style="width:${progress}%"></div></div><h2>${esc(q.q)}</h2><div class="opts">${options}</div>${explain}${allReasons}${locked?`<div class="touchbar"><button class="btn" id="next">${position===run.length-1?'See results':'Next question →'}</button></div>`:'<p class="small">Choose one answer. Your choice locks immediately.</p>'}</section>`;
 if(!locked)el.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.option))));else document.getElementById('next').onclick=next;
}
function choose(opt){if(answered[position])return;let q=run[position];answered[position]={id:q.id,choice:opt,correct:q.correct===null?null:opt===q.correct};renderQuestion()}
function next(){if(position<run.length-1){position++;renderQuestion();scrollTop()}else{storeScore();mode='results';render();scrollTop()}}
function renderResults(){const wrong=answered.filter(a=>a.correct===false),right=answered.filter(a=>a.correct===true),uns=answered.filter(a=>a.correct===null);
 el.innerHTML=`<section class="panel"><span class="pill">Attempt complete</span><h2 style="margin-top:14px">Your result</h2><h1 style="font-size:clamp(34px,7vw,48px)">${score()}/${graded()}</h1><p class="sub">${run.length} questions answered • ${right.length} correct • ${wrong.length} wrong • ${uns.length} not scored due to ambiguity</p><div class="actions"><button class="btn secondary" id="showright">Correct Answers (${right.length})</button><button class="btn secondary" id="showwrong">Wrong Answers (${wrong.length})</button></div><div class="actions"><button class="btn ghost" id="showuncertain">Questions needing review (${uns.length})</button></div><div class="actions"><button class="btn" id="retry" ${wrong.length?'':'disabled'}>Retry wrong questions (${wrong.length})</button><button class="btn secondary" id="restart">Start new full test</button></div><button class="btn secondary full" style="margin-top:12px" id="backhome">Back to start</button></section><p class="footer-note">The practice PDF has no answer key. All scored answers and explanations are independently inferred from the lecture material; flagged questions are not graded.</p>`;
 document.getElementById('showright').onclick=()=>showReview('right');document.getElementById('showwrong').onclick=()=>showReview('wrong');document.getElementById('showuncertain').onclick=()=>showReview('uncertain');document.getElementById('retry').onclick=()=>makeRun(wrong.map(x=>x.id));document.getElementById('restart').onclick=()=>makeRun(BANK.map(x=>x.id));document.getElementById('backhome').onclick=home
}
function showReview(type){reviewMode=type;mode='review';render();scrollTop()}
function renderReview(){let list=answered.filter(a=>reviewMode==='right'?a.correct===true:reviewMode==='wrong'?a.correct===false:a.correct===null);let title=reviewMode==='right'?'Correct Answers':reviewMode==='wrong'?'Wrong Answers':'Questions needing review';let sections=list.map((a,i)=>{let q=BANK.find(x=>x.id===a.id),c=q.correct;return `<article class="review-item"><p class="small"><b>${i+1} of ${list.length}</b></p><h3>${esc(q.q)}</h3>${c===null?`<p class="picked">Your answer: ${esc(q.options[a.choice])}</p><p>${esc(q.why[a.choice])}</p><div class="notice">${esc(q.flag)}</div>`:`${reviewMode==='wrong'?`<p class="picked">Your answer: ${esc(q.options[a.choice])}</p><p><b>Why wrong:</b> ${esc(q.why[a.choice])}</p>`:''}<p class="answer">Correct answer: ${esc(q.options[c])}</p><p><b>Why right:</b> ${esc(q.why[c])}</p>`}</article>`}).join('')||'<p>Nothing to show in this group.</p>';
 el.innerHTML=`<section class="panel"><h2>${title}</h2><p class="sub">${list.length} question${list.length===1?'':'s'}</p><div class="actions"><button class="btn secondary" id="resultsback">← Back to results</button>${reviewMode==='wrong'&&list.length?'<button class="btn" id="retryhere">Retry these wrong questions</button>':''}</div>${sections}<div class="actions"><button class="btn secondary full" id="resultsbottom">← Back to results</button></div></section>`;document.getElementById('resultsback').onclick=()=>{mode='results';render();scrollTop()};document.getElementById('resultsbottom').onclick=()=>{mode='results';render();scrollTop()};const retry=document.getElementById('retryhere');if(retry)retry.onclick=()=>makeRun(list.map(x=>x.id))
}
if(BANK.length!==70||BANK.some(q=>q.options.length!==5||q.why.length!==5)||new Set(BANK.map(q=>q.id)).size!==70){el.textContent='Question data validation failed.'}else render();
</script></body></html>
